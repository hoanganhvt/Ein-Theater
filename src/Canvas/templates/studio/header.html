    <!-- ── Global Header ────────────────────────────────────────────── -->
    <header class="studio-bar">
        <nav class="mode-tabs" id="appModeTabs" aria-label="Workspace modes">
            <button class="mode-tab active" data-mode="canvas" aria-current="page">Canvas</button>
        </nav>
    </header>
    <div class="header">
        <div class="header-left">
            <!-- File Menu Dropdown -->
            <div class="menu-dropdown">
                <button class="btn menu-btn" id="fileMenuBtn" onclick="toggleFileMenu(event)" title="File options">File ▾</button>
                <div class="menu-dropdown-content" id="fileMenuDropdown">
                    <div class="menu-item" onclick="saveActiveModel(); closeFileMenu();">

                        <span class="menu-text">Save Model</span>
                        <span class="menu-badge">Ctrl+S</span>
                    </div>
                    <div class="menu-item" onclick="openSelectFolderModal(); closeFileMenu();">

                        <span class="menu-text">Select Folder...</span>
                    </div>
                    <div class="menu-item disabled" title="Open File (coming soon)">

                        <span class="menu-text">Open File...</span>
                        <span class="menu-badge">Soon</span>
                    </div>
                    <div class="menu-separator"></div>
                    <div class="menu-item-info">
                        <span class="menu-info-label">Working Directory:</span>
                        <span class="menu-info-val" id="menuWorkingDir">None</span>
                    </div>
                </div>
            </div>

            <div class="header-divider"></div>

            <div class="model-title-wrap" onclick="startRename()" title="Click to rename model">
                <h1 id="modelTitle">Untitled Model</h1>
                <input id="modelTitleInput" type="text" maxlength="80"
                       onblur="commitRename()"
                       onkeydown="if(event.key==='Enter')commitRename();if(event.key==='Escape')cancelRename();" />
            </div></div>

        <div class="toolbar">
            <!-- Connection Type Pills in Header Toolbar -->
            <div id="headerEdgeToolbar" class="header-edge-toolbar" style="display:none;" onmousedown="event.preventDefault()">
                <span class="header-edge-title" id="headerEdgeTitle">Edge:</span>
                <span class="header-edge-nodes" id="headerEdgeNodes"></span>
                <div class="header-edge-pills">
                    <button class="btn-edge-pill" id="hdrBtnNormal" onclick="setSelectedEdgeType('normal')" title="Set connection to Normal Flow (unindexed)">
                        <span class="pill-dot dot-normal"></span> Normal
                    </button>
                    <button class="btn-edge-pill" id="hdrBtnResidual" onclick="setSelectedEdgeType('residual')" title="Set connection to Residual (+) (indexed)">
                        <span class="pill-dot dot-residual"></span> Residual (+)
                    </button>
                    <button class="btn-edge-pill" id="hdrBtnSkip" onclick="setSelectedEdgeType('skip')" title="Set connection to Skip (Concat) (indexed)">
                        <span class="pill-dot dot-skip"></span> Skip (Concat)
                    </button>
                </div>
                <div class="toolbar-divider-sm"></div>
                <div class="header-edge-actions">
                    <button class="btn-edge-pill" onclick="cycleSelectedEdgeFold()" title="Cycle bend mode (Space)">Fold</button>
                    <button class="btn-edge-pill" onclick="openEditEdgeModal()" title="Edit connection details">Details</button>
                    <button class="btn-edge-pill btn-edge-pill-danger" onclick="deleteSelectedEdge()" title="Delete connection">Delete</button>
                </div>
                <div class="toolbar-divider-sm"></div>
            </div>

            <button class="btn btn-save" id="btnSaveModel" onclick="saveActiveModel()" title="Save Model (Ctrl+S)">Save model</button>
            <button class="btn" onclick="fitView()">Fit View</button>
            <button class="btn btn-clear" onclick="clearGraph()">Clear Canvas</button>
        </div>
    </div>
