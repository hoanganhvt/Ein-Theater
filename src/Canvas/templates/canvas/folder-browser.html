    <!-- ── Select Folder Modal ─────────────────────────────────────── -->
    <div id="selectFolderModal">
        <div class="modal-header">
            <h3>Select Working Directory</h3>
            <button class="modal-close-btn" onclick="closeSelectFolderModal()" title="Close">✕</button>
        </div>
        <div class="folder-modal-body">
            <div class="folder-path-bar">
                <button class="btn btn-icon" onclick="browseParentFolder()" title="Go up one folder level"> Up</button>
                <input type="text" id="folderPathInput" placeholder="Enter folder path and press Enter..."
                       onkeydown="if(event.key==='Enter')applyTypedPath();" />
                <button class="btn" onclick="applyTypedPath()">Go</button>
                <button class="btn btn-icon" onclick="promptCreateFolderModal()" title="Create a new folder in this directory"> New Folder</button>
            </div>
            <div class="folder-drives-bar" id="folderDrivesBar">
                <!-- Drive chips rendered by JS -->
            </div>
            <div class="folder-hint">
                 Click a folder to select it; double-click to browse inside. Use <strong>Select This Folder</strong> to confirm.
            </div>
            <div class="folder-browser-list" id="folderBrowserList">
                <!-- Directories rendered by JS -->
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-system-browse" onclick="browseSystemFolder()" title="Open Windows native folder dialog">Browse System...</button>
            <div class="modal-footer-spacer"></div>
            <button class="btn" onclick="closeSelectFolderModal()">Cancel</button>
            <button class="btn btn-primary" id="confirmFolderBtn" onclick="confirmSelectFolder()" title="Select the currently browsed directory as the working directory">Select This Folder</button>
        </div>
    </div>
