<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Name}} · EinTheater</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-studio-mode="{{.ID}}">
  <header class="studio-bar" id="studioMenubar">
    <a class="brand-mark" href="/">Ein<span>Theater</span></a>
    <div class="menu-dropdown"><button type="button" class="menu-btn" id="fileMenuBtn" aria-expanded="false" aria-controls="fileMenuDropdown">File</button>
      <div class="menu-dropdown-content" id="fileMenuDropdown">
        <button type="button" class="menu-item" data-command="open-folder">Open Folder…</button>
        <button type="button" class="menu-item" data-command="save" disabled title="Save is available in Canvas">Save Model <span class="menu-badge">Ctrl+S</span></button>
        <div class="menu-separator"></div><div class="menu-item-info"><span class="menu-info-label">Workspace</span><span class="menu-info-val" id="menuWorkingDir">None</span></div>
      </div>
    </div>
    <div class="menu-dropdown"><button type="button" class="menu-btn" id="editMenuBtn" aria-expanded="false" aria-controls="editMenuDropdown">Edit</button>
      <div class="menu-dropdown-content" id="editMenuDropdown">
        <button type="button" class="menu-item" disabled>Undo</button><button type="button" class="menu-item" disabled>Redo</button>
        <div class="menu-separator"></div><button type="button" class="menu-item" disabled>Cut</button><button type="button" class="menu-item" disabled>Copy</button><button type="button" class="menu-item" disabled>Paste</button>
      </div>
    </div>
    <div class="menu-dropdown"><button type="button" class="menu-btn" id="modeMenuBtn" aria-expanded="false" aria-controls="modeMenuDropdown">Mode</button>
      <nav class="menu-dropdown-content mode-menu" id="modeMenuDropdown" aria-label="Workspace modes"><div id="appModeTabs"></div></nav>
    </div>
    <span class="studio-current-mode">{{.Name}}</span>
  </header>
  <main class="mode-shell"><div class="mode-shell-card"><span class="mode-shell-kicker">EinTheater Studio</span><h1>{{.Name}}</h1><p>{{.Name}} is in development. Open a folder to set your workspace, or return to Canvas to edit a model.</p><button type="button" class="btn btn-primary" id="shellOpenFolder">Open Folder…</button><a class="mode-shell-link" href="/canvas">Open Canvas →</a></div></main>
  <script type="module" src="/static/studio/navigation.js"></script>
  <script type="module" src="/static/studio/menubar.js"></script>
  <script type="module" src="/static/studio/shell.js"></script>
</body></html>
